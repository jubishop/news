name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-decision:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Decide whether deployment is needed
        id: decision
        run: bin/deployment-decision "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the minimum and production's runtime; 3.x is the latest stable release.
        python-version: ['3.14', '3.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install ShellCheck and Restic
        run: sudo apt-get update && sudo apt-get install --yes shellcheck restic
      - name: Set up application and browser
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Check repository
        run: bin/check --full

  deploy:
    needs: [check, deployment-decision]
    if: needs.deployment-decision.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://news.jubishop.com
    concurrency:
      group: news-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWS_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/news-deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/news-known-hosts"
      - name: Deploy validated main revision
        env:
          NEWS_DEPLOY_HOST: ${{ vars.NEWS_DEPLOY_HOST }}
          NEWS_DEPLOY_KEY: ${{ runner.temp }}/news-deploy-key
          NEWS_DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/news-known-hosts
          REVISION: ${{ github.sha }}
        run: ops/deploy-main "$REVISION"
      - name: Remove deploy identity
        if: always()
        run: rm -f "$RUNNER_TEMP/news-deploy-key" "$RUNNER_TEMP/news-known-hosts"
